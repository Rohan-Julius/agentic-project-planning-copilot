# Demo / packaging topology (spec §15, §26). Not required for local dev: the backend
# defaults to an embedded, file-backed Qdrant (no QDRANT_URL set) and a natively-run
# Ollama. This compose file is the opt-in server-based topology used for the demo/
# production package. Finalized on Day 24.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - ollama
      - qdrant
    environment:
      OLLAMA_HOST: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_apiBaseUrl: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  ollama_models:
  qdrant_storage:
