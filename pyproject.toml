[project]
name = "agentic-project-planning-copilot"
version = "0.1.0"
description = "Local agentic AI that turns raw requirements into a reviewable project plan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Backend / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # Agent orchestration + local LLM
    "langgraph>=0.2",
    "ollama>=0.3",
    # RAG
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "rank-bm25>=0.2.2",
    # Document parsing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    # Storage
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",          # FastAPI TestClient
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
